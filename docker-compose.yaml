services:
  # Local-only Postgres. In production (Coolify) the DB is external — set DATABASE_URL and
  # do NOT activate this profile. Locally: `docker compose --profile local up`.
  postgres:
    image: postgres:16-alpine
    profiles: ["local"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scopegate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    # `app` is a shared alias in Coolify's `coolify` network — 7 containers claim it and Docker
    # DNS round-robins between them, so `http://app:3000` from cron lands in strangers' apps.
    # Qualify it: the cron container dials `scopegate-app` (see docker/crontab).
    # The alias must sit on the explicit `internal` network, not on `default`: Coolify's
    # "Connect To Predefined Network" attaches services to `coolify` and never brings the
    # compose `default` network up, which silently drops the alias and kills cron DNS.
    networks:
      internal:
        aliases:
          - scopegate-app
    environment:
      # External DB in prod; falls back to the local `postgres` service for `--profile local`.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/scopegate?schema=public}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@scopegate.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
    # Coolify proxies traffic to the container by FQDN over its internal network —
    # publish the port to the host only for local runs (uncomment for `--profile local`).
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    # Coolify reads the healthcheck from compose, not from the Dockerfile's HEALTHCHECK.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Triggers CRON_SECRET-guarded endpoints on schedule (see docker/crontab).
  # Separate service = a single runner, so jobs don't double-fire if app is scaled to >1 replica.
  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    networks:
      - internal
    depends_on:
      - app
    # ponytail: liveness only — supercronic running means the schedule is being served.
    healthcheck:
      test: ["CMD-SHELL", "pgrep supercronic > /dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

# Own private network so app/cron/postgres always share one DNS namespace, whatever
# extra networks Coolify attaches on top.
networks:
  internal:

volumes:
  postgres_data:
