# Dark Flow — CI gate
#
# Runs cheap, deterministic checks (lint + tests) on every push and reports the
# result as a plain red/green status. No AI and no API cost: GitHub only runs the
# checks.
#
# It does NOT file issues or tasks. The `ci-watch` routine (in the local Dark
# Flow worker, every 30 min) reads this workflow's conclusion and files a
# `source:ci` task, reading the failure detail straight out of this run's log via
# `gh run view --log-failed`. `fix-ci-issue` then fixes it, up to 3 attempts.
#
# Loop:  red CI  →  ci-watch → source:ci task  →  fix-ci-issue (≤3 retries)  →  green CI  →  task closed
#
# Before v4.20.0 this file created a GitHub issue itself. That never reached the
# task store — the job runs inside GitHub Actions and cannot call the local `df`
# CLI — so the issues piled up unread. Hence the split: GitHub runs the checks,
# the local worker does the bookkeeping.
#
# Customise:
#   - Edit the checks in the `Run checks` step below to match your stack.
#   - To run AFTER an existing build workflow instead of on every push, replace
#     the `on:` block with the commented `workflow_run` example.
name: darkflow-ci-gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Run after another workflow named "build" finishes, instead of on push:
  # workflow_run:
  #   workflows: ["build"]
  #   types: [completed]

permissions:
  contents: read

jobs:
  gate:
    # Runs on the self-hosted runner (runner-scopegate in the github-runner
    # Coolify service) — no GitHub Actions minutes. timeout-minutes bounds a hang
    # to a fast, visible `failure` instead of a run that sits in `queued` forever.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run checks
        id: checks
        shell: bash
        run: |
          set -uo pipefail
          failed=""        # comma list of failed check names
          report=""         # markdown body fragments

          run_check() {
            local name="$1"; shift
            echo "::group::$name"
            if "$@" 2>&1 | tee /tmp/check.txt; then
              echo "::endgroup::"
            else
              echo "::error::$name failed"
              echo "::endgroup::"
              failed="${failed:+$failed, }$name"
              report="${report}"$'\n\n'"### \`$name\`"$'\n'"\`\`\`"$'\n'"$(tail -n 80 /tmp/check.txt)"$'\n'"\`\`\`"
            fi
          }

          # ── Node / pnpm / npm ────────────────────────────────────────────────
          # pnpm + node are already on PATH here (provisioned by the setup steps).
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then
              run_check "install" pnpm install --frozen-lockfile
              run_check "build" bash -c "node_modules/.bin/prisma generate && node_modules/.bin/tsc --noEmit"
              grep -q '"lint"' package.json && run_check "lint" pnpm lint
              grep -q '"test"' package.json && run_check "test" pnpm test
            else
              run_check "install" npm ci
              grep -q '"lint"' package.json && run_check "lint" npm run lint
              grep -q '"test"' package.json && run_check "test" npm test
            fi
          fi

          # ── Python / ruff / pytest ───────────────────────────────────────────
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            if command -v ruff >/dev/null 2>&1 || pip install ruff >/dev/null 2>&1; then
              run_check "ruff" ruff check .
            fi
            if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
              pip install pytest >/dev/null 2>&1 || true
              run_check "pytest" pytest -q
            fi
          fi

          {
            echo "failed=${failed}"
            echo "report<<__DF_EOF__"
            echo "${report}"
            echo "__DF_EOF__"
          } >> "$GITHUB_OUTPUT"

          # Fail the job so the red status is visible, but the issue step still runs.
          [ -z "$failed" ] || exit 1
