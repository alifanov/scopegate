services:
  # Local-only Postgres. In production (Coolify) the DB is external — set DATABASE_URL and
  # do NOT activate this profile. Locally: `docker compose --profile local up`.
  postgres:
    image: postgres:16-alpine
    profiles: ["local"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scopegate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    # `app` is a shared alias in Coolify's `coolify` network — 7 containers claim it and Docker
    # DNS round-robins between them, so `http://app:3000` from cron lands in strangers' apps.
    # Qualify it: the cron container dials `scopegate-app` (see docker/crontab).
    # The alias must sit on the explicit `internal` network, not on `default`: Coolify's
    # "Connect To Predefined Network" attaches services to `coolify` and never brings the
    # compose `default` network up, which silently drops the alias and kills cron DNS.
    networks:
      internal:
        aliases:
          - scopegate-app
    environment:
      # External DB in prod; falls back to the local `postgres` service for `--profile local`.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/scopegate?schema=public}
      # Left unset here on purpose (Task #229): docker-entrypoint.sh generates a strong random
      # value on first boot and persists it on the app_data volume when the env var is empty, so
      # a self-host quick start needs zero manual .env editing. Set either var explicitly (e.g. in
      # Coolify) to skip generation and pin your own value.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@scopegate.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # Only what is listed here reaches the container — Coolify substitutes ${VAR}
      # from the resource's env, it does not pass the whole environment through.
      # A provider whose creds are missing here is simply unusable at runtime.
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      JIRA_CLIENT_ID: ${JIRA_CLIENT_ID:-}
      JIRA_CLIENT_SECRET: ${JIRA_CLIENT_SECRET:-}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      # Cloud-only (scopegate.dev); all unset in a self-hosted deployment.
      SCOPEGATE_CLOUD: ${SCOPEGATE_CLOUD:-}
      GOOGLE_SIGNIN_CLIENT_ID: ${GOOGLE_SIGNIN_CLIENT_ID:-}
      GOOGLE_SIGNIN_CLIENT_SECRET: ${GOOGLE_SIGNIN_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_SERVER: ${POLAR_SERVER:-}
      POLAR_PRODUCT_PRO: ${POLAR_PRODUCT_PRO:-}
      POLAR_PRODUCT_TEAM: ${POLAR_PRODUCT_TEAM:-}
    # Persists generated secrets (see docker-entrypoint.sh) across restarts/redeploys — without
    # this, a container recreate would rotate BETTER_AUTH_SECRET and strand encrypted tokens.
    volumes:
      - app_data:/app/data
    # Coolify proxies traffic to the container by FQDN over its internal network — local port
    # publishing lives in docker-compose.override.yml, auto-merged only for `docker compose up`
    # without an explicit `-f` (i.e. never for Coolify's deploy).
    expose:
      - "3000"
    # Coolify reads the healthcheck from compose, not from the Dockerfile's HEALTHCHECK.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Triggers CRON_SECRET-guarded endpoints on schedule (see docker/crontab).
  # Separate service = a single runner, so jobs don't double-fire if app is scaled to >1 replica.
  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    networks:
      - internal
    depends_on:
      - app
    # ponytail: liveness only — supercronic running means the schedule is being served.
    healthcheck:
      test: ["CMD-SHELL", "pgrep supercronic > /dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

# Own private network so app/cron/postgres always share one DNS namespace, whatever
# extra networks Coolify attaches on top.
networks:
  internal:

volumes:
  postgres_data:
  app_data:
